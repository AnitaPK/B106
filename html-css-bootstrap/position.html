<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 700px;
            height: 700px;
            border: 1px solid gray;
            position: relative;
        }
        .Navbar{
            height: 100px;
            width: 100%;
            background-color: orange;
            position: absolute;
            z-index: 1;
        }
        .aside{
            width: 200px;
            height: 700px;
            background-color: rgb(102, 255, 0);
            position: absolute;
            top:0
            
        }
        .circularBox{
            width: 300px;
            height: 300px;
            background-image: radial-gradient(yellow,brown);
            border-radius: 50%;
            position: absolute;
            top:200px;
            /* left:200px; */
            right: -100px;

        }
        .squareBox{
            width: 100px;
            height: 100px;
            background-image: linear-gradient(to right,red,blue,red,blue);
            position: absolute;
            z-index: 1;
            bottom: 5%;
            right: 5%;
        }
    </style>
</head>

<body>
    <nav class="nav"></nav>
    <div class="container">
        <div class="Navbar"></div>
        <div class="aside"></div>
        <div class="circularBox"></div>
        <div class="squareBox"></div>
    </div>
    <div class="GoTOTop"></div>
</body>

</html>
