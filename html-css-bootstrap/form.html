<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <fieldset>
            <legend>Register Form</legend>
            <label for="">Full name</label>
            <input type="text" value="John Doe" name="full_name">
            <br>
            <label for="">Age</label>
            <input type="number" value="18" name="age">
            <label for="">Birath Date</label>
            <input type="date" name="birthDate">
            <label for="">Appointment</label>
            <input type="datetime-local"><br>
            <label for="">Select Subjects</label>
            <input type="checkbox" id="math" name="sub1">
            <label for="math" value="maths" >Maths</label>
            <input type="checkbox" id="eng" name="sub2">
            <label for="eng" value="english">English</label>
            <input type="checkbox" id="sci" name="sub3">
            <label for="sci" value="science">Science</label>
<br>
            <label for="">Select Gender</label>
            <input type="radio" name="gender" value="male">
            <label for="">Male</label>
            <input type="radio" name="gender" value="female">
            <label for="">Female</label>
<br>
            <label for="">Select Browser</label>
            <select name="browser" id="">
                <option value="chrome">Chrome</option>
                <option value="safari">Safari</option>
                <option value="firefox">Firefox</option>
            </select>
            <label for="">Select Color</label>
            <input type="color" value="#0000ff">
        </fieldset>
    </form>
</body> 
</html>
